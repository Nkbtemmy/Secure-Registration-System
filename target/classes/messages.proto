syntax = "proto3";

package com.nkubito.proto;

option java_package = "com.nkubito.proto";
option java_outer_classname = "Messages";

// Wrapper for all signed responses
message SignedResponse {
    bytes body = 1;      // Serialized Protocol Buffer object of the actual response
    bytes signature = 2; // Dilithium signature of the serialized body
}

// Request to create a new user (Admin action)
message CreateUserRequest {
    string name = 1;
    string email = 2;
}

// Response after creating a user
message CreateUserResponse {
    string name = 1;
    string email = 2;
    string registration_code = 3;
}

// Request for user registration
message RegisterUserRequest {
    string email = 1;
    string registration_code = 2;
}

// Response after successful user registration
message RegisterUserResponse {
    string auth_token = 1;
    string name = 2;
    string email = 3;
}

// Response containing the server's public key
message PublicKeyResponse {
    bytes public_key = 1;
    string algorithm = 2;
}

// Error response
message ErrorResponse {
    string error = 1;
    string message = 2;
    int32 status = 3;
}
